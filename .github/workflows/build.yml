name: Build site

# Builds the site with warnings as errors on every push and pull request, as a check.
# The site itself is served from the Flatiron file system; see "Deploying" in README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The package documentation is generated from the installed boss-bench package,
      # pinned to the release that accompanies the paper.
      - run: pip install boss-bench==1.0.0
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
