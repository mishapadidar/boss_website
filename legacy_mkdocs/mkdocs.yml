site_name: BoSS
site_description: >-
  BoSS, the Benchmark of Stellarator Simulations: stellarator configurations
  paired with physics simulations, for machine learning and fusion design.
# TODO: switch to the custom domain once it exists (and add docs/CNAME).
site_url: https://mishapadidar.github.io/artemiss_website/
use_directory_urls: false
copyright: Copyright &copy; 2026 The BoSS authors · Data released under Apache 2.0

theme:
  name: material
  language: en
  icon:
    logo: material/atom-variant
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Get started:
      - Overview: index.md
      - Download: download.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Loading the data: tutorials/loading.md
      - Working with records: tutorials/examples.md
  - Data documentation:
      - Overview: data/index.md
      - Configuration fields: data/configurations.md
      - Fast-ion confinement: data/fast-ion.md
  - Tools:
      - Navigator: navigator.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/solid/database
      link: https://huggingface.co/datasets/mishapadidar/ARTEMISS
      name: BoSS on Hugging Face
    - icon: fontawesome/solid/envelope
      link: mailto:mpadidar@flatironinstitute.org
      name: Contact
