{#- Previous / Next buttons in the style of the simsopt docs (sphinx_rtd_theme):
    plain "Previous" and "Next" labels with circled arrows, the page title on
    hover. Overrides pydata-sphinx-theme's components/prev-next.html. -#}
<div class="boss-footer-buttons" role="navigation" aria-label="Footer">
  {%- if prev %}
  <a href="{{ prev.link|e }}" class="boss-btn boss-btn-prev"
     title="{{ (prev_title or prev.title)|striptags|e }}" accesskey="p" rel="prev">
    <i class="fa-solid fa-circle-arrow-left" aria-hidden="true"></i> Previous</a>
  {%- endif %}
  {%- if next %}
  <a href="{{ next.link|e }}" class="boss-btn boss-btn-next"
     title="{{ (next_title or next.title)|striptags|e }}" accesskey="n" rel="next">
    Next <i class="fa-solid fa-circle-arrow-right" aria-hidden="true"></i></a>
  {%- endif %}
</div>
